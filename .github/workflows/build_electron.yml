name: Build DCUB Desktop Apps

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: "Build MacOS app"
        required: true
        default: "true"
      build_linux:
        description: "Build Linux app"
        required: true
        default: "true"
      build_windows:
        description: "Build Windows app"
        required: true
        default: "true"
      publish_release:
        description: "Publish a GitHub Release with the built artifacts"
        required: true
        default: "true"
      release_tag:
        description: "Release tag (e.g. v1.0.1) — required when publish_release is true"
        required: false
        default: "v1.0.0"

jobs:
  # ==================================================
  # macOS build
  # ==================================================
  build-macos:
    if: ${{ github.event.inputs.build_macos == 'true' }}
    name: Build MacOS Electron App
    runs-on: macos-latest
    continue-on-error: true

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.11.0
          cache: npm
          cache-dependency-path: |
            ui/DCUB/package-lock.json
            ui/DCUB/electron/package-lock.json

      # --------------------------------------------------
      # 3. Set up Python (for FastAPI build)
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # --------------------------------------------------
      # 4. Install Poetry + Python dependencies
      # --------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install poetry
          python -m poetry install --no-interaction --with build

      # --------------------------------------------------
      # 5. Build standalone FastAPI server
      # --------------------------------------------------
      - name: Build FastAPI standalone executable
        run: |
          chmod +x build_fastapi.sh
          ./build_fastapi.sh

      # --------------------------------------------------
      # 6. Verify FastAPI executable exists
      # --------------------------------------------------
      - name: Verify FastAPI build output
        run: |
          ls -la ui/DCUB/backend
          ls -la ui/DCUB/backend/fastapi_server
          test -x ui/DCUB/backend/fastapi_server/fastapi_server

      # --------------------------------------------------
      # 7. Install UI dependencies
      # --------------------------------------------------
      - name: Install UI dependencies
        working-directory: ui/DCUB
        run: npm ci

      # --------------------------------------------------
      # 8. Install Electron dependencies
      # --------------------------------------------------
      - name: Install Electron dependencies
        working-directory: ui/DCUB/electron
        run: npm ci

      # --------------------------------------------------
      # 9. Build Next.js UI + prepare Electron assets
      # --------------------------------------------------
      - name: Build web UI for Electron
        working-directory: ui/DCUB
        run: npm run electron-build

      # --------------------------------------------------
      # 10. Build Electron desktop application
      # --------------------------------------------------
      - name: Build Electron app
        working-directory: ui/DCUB/electron
        run: npm run build-electron

      # --------------------------------------------------
      # 11. Upload Electron build artifacts
      # --------------------------------------------------
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DCUB-macOS-build
          path: |
            ui/DCUB/electron/dist/*.dmg

  # ==================================================
  # Linux build
  # ==================================================
  build-linux:
    if: ${{ github.event.inputs.build_linux == 'true' }}
    name: Build Linux Electron App
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.11.0
          cache: npm
          cache-dependency-path: |
            ui/DCUB/package-lock.json
            ui/DCUB/electron/package-lock.json
      
      # --------------------------------------------------
      # 3. Set up Python (for FastAPI build)
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # --------------------------------------------------
      # 4. Install Electron System dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnss3 libxss1 libasound2t64

      # --------------------------------------------------
      # 5. Install Poetry + Python dependencies
      # --------------------------------------------------
      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install poetry
          python -m poetry install --no-interaction --with build

      # --------------------------------------------------
      # 6. Build standalone FastAPI server
      # --------------------------------------------------
      - name: Build FastAPI backend
        run: |
          chmod +x build_fastapi.sh
          ./build_fastapi.sh

      # --------------------------------------------------
      # 7. Install UI dependencies
      # --------------------------------------------------
      - name: Install UI dependencies
        working-directory: ui/DCUB
        run: npm ci

      # --------------------------------------------------
      # 8. Install Electron dependencies
      # --------------------------------------------------
      - name: Install Electron dependencies
        working-directory: ui/DCUB/electron
        run: npm ci

      # --------------------------------------------------
      # 9. Build Next.js UI + prepare Electron assets
      # --------------------------------------------------
      - name: Build web UI for Electron
        working-directory: ui/DCUB
        run: npm run electron-build

      # --------------------------------------------------
      # 10. Build Electron desktop application
      # --------------------------------------------------
      - name: Build Electron app
        working-directory: ui/DCUB/electron
        run: npm run build-electron -- --linux

      # --------------------------------------------------
      # 11. Upload Electron build artifacts
      # --------------------------------------------------
      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DCUB-Linux-build
          path: |
            ui/DCUB/electron/dist/*.AppImage
            ui/DCUB/electron/dist/*.deb

  # ==================================================
  # Windows build
  # ==================================================
  build-windows:
    if: ${{ github.event.inputs.build_windows == 'true' }}
    name: Build Windows Electron App
    runs-on: windows-latest
    continue-on-error: true

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Node.js
      # --------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23.11.0
          cache: npm
          cache-dependency-path: |
            ui/DCUB/package-lock.json
            ui/DCUB/electron/package-lock.json
      
      # --------------------------------------------------
      # 3. Set up Python (for FastAPI build)
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # --------------------------------------------------
      # 4. Install Poetry + Python dependencies
      # --------------------------------------------------
      - name: Install Python dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install poetry
          python -m poetry install --no-interaction --with build

      # --------------------------------------------------
      # 6. Build standalone FastAPI server
      # --------------------------------------------------
      - name: Build FastAPI backend
        shell: cmd 
        run: |
          .\build_fastapi.bat  

      # --------------------------------------------------
      # 7. Install UI dependencies
      # --------------------------------------------------
      - name: Install UI dependencies
        working-directory: ui/DCUB
        run: npm ci

      # --------------------------------------------------
      # 8. Install Electron dependencies
      # --------------------------------------------------
      - name: Install Electron dependencies
        working-directory: ui/DCUB/electron
        run: npm ci

      # --------------------------------------------------
      # 9. Build Next.js UI + prepare Electron assets
      # --------------------------------------------------
      - name: Build web UI for Electron
        working-directory: ui/DCUB
        run: npm run electron-build

      # --------------------------------------------------
      # 10. Build Electron desktop application
      # --------------------------------------------------
      - name: Build Electron app
        working-directory: ui/DCUB/electron
        run: npm run build-electron -- --win

      # --------------------------------------------------
      # 11. Upload Electron build artifacts
      # --------------------------------------------------
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: DCUB-Windows-build
          path: ui/DCUB/electron/dist/*.exe

  # ==================================================
  # Publish GitHub Release
  # ==================================================
  publish-release:
    name: Publish GitHub Release
    if: ${{ github.event.inputs.publish_release == 'true' }}
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download macOS artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DCUB-macOS-build
          path: artifacts

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DCUB-Linux-build
          path: artifacts

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: DCUB-Windows-build
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: DCUB ${{ github.event.inputs.release_tag }}
          files: artifacts/*
          fail_on_unmatched_files: false
